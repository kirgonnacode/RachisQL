# Пример: опиши здесь свои таблицы из БД (одна модель = один YAML-файл
# в этой папке, либо несколько моделей в одном файле под ключом `models:`).
# Полная спецификация полей: https://docs.getwren.ai/oss/reference/mdl
#
# Проверить структуру и собрать MDL:
#   wren context build
#
# Пример ниже для несуществующей таблицы `orders` нужно заменить на реальные таблицы и колонки.

models:
  - name: orders
    tableReference:
      schema: public
      table: orders
    properties:
      description: "Заказы клиентов"
    columns:
      - name: id
        type: integer
        properties:
          description: "Первичный ключ заказа"
      - name: customer_id
        type: integer
        properties:
          description: "Ссылка на клиента"
      - name: total
        type: numeric
        properties:
          description: "Сумма заказа в рублях"
      - name: created_at
        type: timestamp
        properties:
          description: "Дата создания заказа"